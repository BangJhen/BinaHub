# ============================================================
# BinaHub — Deploy Frontend to Vercel
# Triggers on push to main when apps/web/** changes
# ============================================================
name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build check
        working-directory: ./apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        if: ${{ secrets.VERCEL_TOKEN != '' && github.ref == 'refs/heads/main' }}
        working-directory: ./apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        if: ${{ secrets.VERCEL_TOKEN != '' && github.ref != 'refs/heads/main' }}
        working-directory: ./apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --token=${{ secrets.VERCEL_TOKEN }}

      - name: Skip deploy (secrets not configured)
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "⚠️  VERCEL_TOKEN not set — skipping deploy."
          echo "Set up secrets in GitHub Settings → Secrets → Actions."
